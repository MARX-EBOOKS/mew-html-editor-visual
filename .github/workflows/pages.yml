name: Deploy Git editor to Pages

on:
  push:
    branches: [main]
    paths:
      - git-editor.html
      - public/**
      - tests/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - git-editor.html
      - public/**
      - tests/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check editor
        run: |
          node --check public/git-platform.js
          node --check public/app.js
          node --test tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir _site
          cp git-editor.html _site/index.html
          cp git-editor.html _site/git-editor.html
          cp -R public _site/public
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
